<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>BRIO feature ad</title>
<link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<!--
  BRIO feature ad template
  ------------------------
  To feature something new, edit the FEATURES object below (or add a new key)
  and open this file with ?feature=<key>&size=<landscape|square|story>.
  Render PNGs with ads/render.ps1.
-->
<style>
  :root {
    --slate: #2B3C41;
    --slate-deep: #1F2D31;
    --blue: #00AAED;
    --white: #FFFFFF;
    --ink: #212121;
    --muted: #9FB3B9;
    --font: 'Work Sans', -apple-system, 'Segoe UI', sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #888; }
  body { font-family: var(--font); }

  .ad {
    position: relative; overflow: hidden;
    width: var(--w); height: var(--h);
    background: radial-gradient(circle at 85% 15%, #34525a 0%, var(--slate) 45%, var(--slate-deep) 100%);
    color: var(--white);
    display: grid;
    padding: var(--pad);
    gap: var(--gap);
  }
  /* Decorative blue arcs */
  .ad::before {
    content: ""; position: absolute; right: -180px; bottom: -220px;
    width: 620px; height: 620px; border-radius: 50%;
    border: 2px solid rgba(0,170,237,.18);
    box-shadow: 0 0 0 60px rgba(0,170,237,.04), 0 0 0 130px rgba(0,170,237,.03);
  }

  .copy { position: relative; display: flex; flex-direction: column; justify-content: center; gap: var(--copy-gap); z-index: 1; }
  .logo { height: var(--logo-h); width: auto; align-self: flex-start; }
  .eyebrow {
    display: inline-flex; align-self: flex-start; align-items: center; gap: 10px;
    font-weight: 600; font-size: var(--eyebrow); letter-spacing: .14em; text-transform: uppercase;
    color: var(--blue);
  }
  .eyebrow::before { content: ""; width: 28px; height: 3px; background: var(--blue); }
  h1 { font-weight: 800; font-size: var(--h1); line-height: 1.08; letter-spacing: -.01em; }
  h1 em { font-style: normal; color: var(--blue); }
  .body { font-weight: 400; font-size: var(--body); line-height: 1.4; color: #D6E2E5; max-width: 30ch; }
  .cta-row { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
  .cta {
    background: var(--blue); color: var(--white);
    font-weight: 700; font-size: var(--cta); padding: .7em 1.2em; border-radius: 6px;
  }
  .note { font-size: var(--note); color: var(--muted); }
  .url { font-size: var(--note); font-weight: 600; color: var(--white); letter-spacing: .02em; }

  /* Visual: sample report card */
  .visual { position: relative; z-index: 1; display: flex; align-items: center; justify-content: center; }
  .card {
    width: 100%; max-width: var(--card-w);
    background: var(--white); color: var(--ink);
    border-radius: 14px; padding: var(--card-pad);
    box-shadow: 0 30px 60px rgba(0,0,0,.35);
    transform: rotate(-1deg);
  }
  .card-label { font-size: 13px; font-weight: 600; letter-spacing: .14em; color: #595959; text-transform: uppercase; }
  .score-row { display: flex; align-items: center; gap: 18px; margin-top: 14px; }
  .ring { width: var(--ring); height: var(--ring); flex: none; }
  .ring text { font-family: var(--font); }
  .verdict { font-weight: 700; font-size: 21px; color: var(--slate); line-height: 1.2; }
  .verdict span { display: block; font-weight: 400; font-size: 15px; color: #595959; margin-top: 4px; }
  .bars { margin-top: 20px; display: grid; gap: 11px; }
  .bar { display: grid; grid-template-columns: 112px 1fr 26px; align-items: center; gap: 10px; font-size: 14px; }
  .bar .track { height: 9px; background: #EFEFEF; border-radius: 5px; overflow: hidden; }
  .bar .fill { height: 100%; background: var(--blue); border-radius: 5px; }
  .bar .fill.low { background: var(--slate); }
  .bar b { font-weight: 700; text-align: right; }
  .first-move {
    margin-top: 18px; padding: 12px 14px; background: #F3F3F3; border-left: 4px solid var(--blue);
    font-size: 13.5px; line-height: 1.35; border-radius: 0 6px 6px 0;
  }
  .first-move strong { color: var(--slate); }

  /* Sizes */
  .landscape { --w: 1200px; --h: 627px; --pad: 56px 64px; --gap: 48px; grid-template-columns: 1.15fr 1fr;
    --copy-gap: 20px; --logo-h: 38px; --eyebrow: 15px; --h1: 50px; --body: 21px; --cta: 20px; --note: 15px;
    --card-w: 430px; --card-pad: 26px 28px; --ring: 104px; }
  .square { --w: 1080px; --h: 1080px; --pad: 72px; --gap: 40px; grid-template-rows: auto 1fr;
    --copy-gap: 22px; --logo-h: 42px; --eyebrow: 17px; --h1: 64px; --body: 25px; --cta: 23px; --note: 17px;
    --card-w: 560px; --card-pad: 30px 34px; --ring: 116px; }
  .square .body { max-width: 40ch; }
  .story { --w: 1080px; --h: 1920px; --pad: 120px 84px; --gap: 96px; grid-template-rows: auto auto;
    --copy-gap: 30px; --logo-h: 52px; --eyebrow: 22px; --h1: 84px; --body: 32px; --cta: 30px; --note: 22px;
    --card-w: 760px; --card-pad: 40px 44px; --ring: 150px; align-content: center; }
  .story .body { max-width: 34ch; }
  .story .card { zoom: 1.3; max-width: 600px; }
  .story .visual { align-items: flex-start; }
</style>
</head>
<body>
<div id="ad" class="ad"></div>

<script>
const FEATURES = {
  'ai-scorecard': {
    eyebrow: 'Free AI readiness scorecard',
    headline: 'Where should <em>AI</em> go first in your business?',
    body: 'Rate your team on 20 statements across five areas. See where AI will save real hours and the three moves to make first.',
    cta: 'Take the 10-minute scorecard',
    note: 'Free. No sales call required.',
    url: 'gobrio.com/ai-scorecard',
    visual: {
      type: 'scorecard',
      label: 'Sample report',
      score: 58,
      verdict: 'Getting there',
      sub: 'Ready for a small, focused pilot',
      areas: [['Use cases', 16], ['Data quality', 8], ['Systems', 13], ['Security', 8], ['People', 13]],
      firstMove: 'List the 5 to 10 fields your first use case needs, and fix those first.'
    }
  }
};

const LOGO = 'https://www.gobrio.com/wp-content/uploads/2025/09/BRIOLogo_WhiteText.png';

function scorecard(v) {
  const r = 44, c = 2 * Math.PI * r, off = c * (1 - v.score / 100);
  const bars = v.areas.map(([name, n]) => `
    <div class="bar"><span>${name}</span>
      <div class="track"><div class="fill ${n < 10 ? 'low' : ''}" style="width:${n / 20 * 100}%"></div></div>
      <b>${n}</b></div>`).join('');
  return `
    <div class="card">
      <div class="card-label">${v.label}</div>
      <div class="score-row">
        <svg class="ring" viewBox="0 0 104 104">
          <circle cx="52" cy="52" r="${r}" fill="none" stroke="#EFEFEF" stroke-width="10"/>
          <circle cx="52" cy="52" r="${r}" fill="none" stroke="#00AAED" stroke-width="10" stroke-linecap="round"
            stroke-dasharray="${c}" stroke-dashoffset="${off}" transform="rotate(-90 52 52)"/>
          <text x="52" y="56" text-anchor="middle" font-size="30" font-weight="800" fill="#2B3C41">${v.score}</text>
          <text x="52" y="73" text-anchor="middle" font-size="10" fill="#595959">out of 100</text>
        </svg>
        <div class="verdict">${v.verdict}<span>${v.sub}</span></div>
      </div>
      <div class="bars">${bars}</div>
      <div class="first-move"><strong>Your first move:</strong> ${v.firstMove}</div>
    </div>`;
}

const VISUALS = { scorecard };

const q = new URLSearchParams(location.search);
const f = FEATURES[q.get('feature') || 'ai-scorecard'];
const size = q.get('size') || 'landscape';
const ad = document.getElementById('ad');
ad.classList.add(size);
ad.innerHTML = `
  <div class="copy">
    <img class="logo" src="${LOGO}" alt="BRIO">
    <div class="eyebrow">${f.eyebrow}</div>
    <h1>${f.headline}</h1>
    <p class="body">${f.body}</p>
    <div class="cta-row"><span class="cta">${f.cta}</span><span class="note">${f.note}</span></div>
    <div class="url">${f.url}</div>
  </div>
  <div class="visual">${VISUALS[f.visual.type](f.visual)}</div>`;
</script>
</body>
</html>
